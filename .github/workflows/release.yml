name: Release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-skill:
    name: Build & Release Skill
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Package Skill
        id: package
        run: python3 package.py

      - name: Check for content changes
        id: check_changes
        run: |
          git add programming-swift
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No content changes detected."
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Content changes detected."
          fi

      - name: Get current date
        if: steps.check_changes.outputs.changes == 'true'
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "human_date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Derive tag-safe version
        if: steps.check_changes.outputs.changes == 'true'
        id: version
        run: |
          # Replace spaces with hyphens so the version is valid in Git tags
          # e.g. "6.3 beta" → "6.3-beta", "6.2.3" → "6.2.3" (no-op)
          TAG_SAFE="${{ steps.package.outputs.swift_version }}"
          TAG_SAFE="${TAG_SAFE// /-}"
          echo "tag_safe=${TAG_SAFE}.${{ steps.date.outputs.date }}" >> $GITHUB_OUTPUT

      - name: Update Claude plugin marketplace metadata
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          # Update the version in marketplace.json to match the extracted Swift version + Date
          # Format: SWIFT_VER.YYYYMMDD (e.g. 6.2.3.20251121, 6.3-beta.20260325)
          jq --arg v "${{ steps.version.outputs.tag_safe }}" \
            '.plugins[0].version = $v' \
            .claude-plugin/marketplace.json > temp.json && mv temp.json .claude-plugin/marketplace.json

      - name: Commit & push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name "Kyle Hughes"
          git config --global user.email "me@kylehugh.es"

          # Note: programming-swift is already staged from the check_changes step

          # Stage the updated marketplace metadata
          git add .claude-plugin/marketplace.json

          git commit -m "Update Skill content and Claude plugin marketplace metadata to ${{ steps.version.outputs.tag_safe }}"

          git push

      - name: Create release
        if: steps.check_changes.outputs.changes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: ${{ steps.version.outputs.tag_safe }}
          name: Swift ${{ steps.package.outputs.swift_version }} (${{ steps.date.outputs.human_date }})
          body: |
             Skill with the complete content of [The Swift Programming Language (${{ steps.package.outputs.swift_version }})](https://github.com/swiftlang/swift-book) as accessed on ${{ steps.date.outputs.human_date }}.
          draft: false
          prerelease: false
          files: programming-swift.zip
          make_latest: true
